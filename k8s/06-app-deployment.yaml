apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-relay
  namespace: agent-relay
spec:
  replicas: 1
  selector:
    matchLabels:
      app: agent-relay
  template:
    metadata:
      labels:
        app: agent-relay
    spec:
      # main.py connects to the database at import time with no retry, so a
      # losing race against Postgres still starting is a hard crash. Block
      # here instead of relying purely on container restarts.
      initContainers:
        - name: wait-for-postgres
          image: postgres:16-alpine
          command:
            - sh
            - -c
            - until pg_isready -h postgres -p 5432 -U agent_relay; do sleep 2; done
      containers:
        - name: agent-relay
          image: agent-relay:latest
          # IfNotPresent, not Never: this is a locally built image with no
          # registry to pull from, and Never fails on Docker Desktop's
          # Kubernetes even when the image is already cached locally.
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: RELAY_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: RELAY_DATABASE_URL
          readinessProbe:
            httpGet:
              path: /ready
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
